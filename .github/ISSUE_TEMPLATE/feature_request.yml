name: Feature Request
description: Suggest an idea or enhancement for MediVoice AI
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make MediVoice AI better? Tell us about it!
  - type: input
    id: feature-title
    attributes:
      label: Feature Title
      description: Brief title for the feature request
      placeholder: e.g. Add WhatsApp/SMS notification webhook after booking confirmation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Clinical Need
      description: Is your feature request related to a problem or specific hospital requirement?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you would like to see happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Any other alternative solutions or features considered?
